kind = "web"
previewPath = "/"
title = "VoIP Reseller Portal"
version = "1.0.0"
id = "artifacts/voip-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20699

[services.development]
run = "pnpm --filter @workspace/voip-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voip-portal", "run", "build" ]
publicDir = "artifacts/voip-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20699"
BASE_PATH = "/"
